<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DMARCpeel – Local DMARC Report Analyzer</title>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 1280px;
      margin: 2rem auto;
      padding: 0 1rem;
      line-height: 1.5;
      color: #1e293b;
      background-color: #f8fafc;
    }
    header {
      margin-bottom: 1.5rem;
    }
    .btn-group {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      align-items: center;
    }
    button {
      background-color: #0f172a;
      color: #ffffff;
      border: none;
      padding: 0.75rem 1.25rem;
      font-size: 1rem;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover {
      background-color: #334155;
    }
    button.secondary {
      background-color: #475569;
    }
    button.secondary:hover {
      background-color: #64748b;
    }
    input[type="file"] {
      display: none;
    }
    #fileInfo {
      margin-top: 0.75rem;
      font-size: 0.9rem;
      color: #64748b;
    }
    .summary-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 1rem 1.5rem;
      margin-top: 1.5rem;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
    }
    .summary-item strong {
      display: block;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #64748b;
    }
    .summary-item span {
      font-size: 1.05rem;
      font-weight: 600;
    }
    .warnings-container {
      margin-top: 1rem;
      background: #fff1f2;
      border: 1px solid #fecdd3;
      border-radius: 8px;
      padding: 0.75rem 1rem;
      font-size: 0.85rem;
      color: #9f1239;
    }
    .warnings-container summary {
      cursor: pointer;
      font-weight: 600;
    }
    .warnings-list {
      margin-top: 0.5rem;
      max-height: 150px;
      overflow-y: auto;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.8rem;
    }
    .nav-bar {
      margin-top: 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: #ffffff;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #e2e8f0;
      margin-top: 1rem;
      font-size: 0.875rem;
    }
    th, td {
      padding: 0.75rem 1rem;
      text-align: left;
      border-bottom: 1px solid #e2e8f0;
    }
    th {
      background-color: #f1f5f9;
      font-weight: 600;
      color: #334155;
      white-space: nowrap;
    }
    tr.clickable-row {
      cursor: pointer;
    }
    tr.clickable-row:hover td {
      background-color: #f1f5f9;
    }
    tr:last-child td {
      border-bottom: none;
    }
    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    .badge {
      display: inline-block;
      padding: 0.15rem 0.5rem;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
    }
    .pass { background-color: #dcfce7; color: #166534; }
    .fail { background-color: #fee2e2; color: #991b1b; }
    .neutral { background-color: #f1f5f9; color: #475569; }
    details {
      margin-top: 2rem;
    }
    summary {
      cursor: pointer;
      font-weight: 600;
      color: #475569;
    }
    pre {
      background-color: #1e293b;
      color: #e2e8f0;
      padding: 1rem;
      border-radius: 8px;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-word;
      margin-top: 0.75rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.85rem;
    }
    .hidden { display: none; }
  </style>
</head>
<body>

  <header>
    <h1>DMARCpeel</h1>
    <p>Analyze a single DMARC report or an entire directory locally in your browser.</p>
  </header>

  <main>
    <div class="btn-group">
      <input type="file" id="singleFileInput" accept=".xml,.gz,.zip,.eml,.msg">
      <button id="openFileBtn">Select Single Report</button>

      <input type="file" id="dirInput" webkitdirectory directory multiple>
      <button id="openDirBtn" class="secondary">Select Directory</button>
    </div>

    <div id="fileInfo">No file or directory selected yet.</div>

    <section id="summarySection" class="summary-card hidden"></section>
    
    <div id="warningsWrapper" class="hidden"></div>

    <div id="detailNav" class="nav-bar hidden">
      <button id="backToOverviewBtn" class="secondary">← Back to Overview</button>
      <span id="detailTitle" style="font-weight: 600; color: #334155;"></span>
    </div>

    <table id="resultTable" class="hidden">
      <thead>
        <tr id="tableHeaderRow"></tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>

    <details id="rawDetails" class="hidden">
      <summary>View Raw Extracted XML</summary>
      <pre id="output"></pre>
    </details>
  </main>

  <script src="app.js"></script>
</body>
</html>
