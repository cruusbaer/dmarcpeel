<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DMARCpeel – Lokal DMARC-analys</title>
  
  <!-- Inkludera Pako (.gz) och JSZip (.zip) via CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <!-- Stabilare CDN-länk för MSGReader -->
  <script src="https://unpkg.com/@kenjiuno/msgreader@1.15.0/dist/MSGReader.min.js"></script>

  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 1200px;
      margin: 2rem auto;
      padding: 0 1rem;
      line-height: 1.5;
      color: #1e293b;
      background-color: #f8fafc;
    }
    header {
      margin-bottom: 1.5rem;
    }
    button {
      background-color: #0f172a;
      color: #ffffff;
      border: none;
      padding: 0.75rem 1.25rem;
      font-size: 1rem;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover {
      background-color: #334155;
    }
    #fileInfo {
      margin-top: 0.75rem;
      font-size: 0.9rem;
      color: #64748b;
    }
    .meta-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 1rem 1.5rem;
      margin-top: 1.5rem;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
    }
    .meta-item strong {
      display: block;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #64748b;
    }
    .meta-item span {
      font-size: 1.05rem;
      font-weight: 600;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: #ffffff;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #e2e8f0;
      margin-top: 1.5rem;
      font-size: 0.9rem;
    }
    th, td {
      padding: 0.75rem 1.25rem;
      text-align: left;
      border-bottom: 1px solid #e2e8f0;
    }
    th {
      background-color: #f1f5f9;
      font-weight: 600;
      color: #334155;
    }
    tr:last-child td {
      border-bottom: none;
    }
    tr:hover td {
      background-color: #f8fafc;
    }
    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    .badge {
      display: inline-block;
      padding: 0.15rem 0.5rem;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
    }
    .pass {
      background-color: #dcfce7;
      color: #166534;
    }
    .fail {
      background-color: #fee2e2;
      color: #991b1b;
    }
    .neutral {
      background-color: #f1f5f9;
      color: #475569;
    }
    .sub-detail {
      display: block;
      font-size: 0.78rem;
      color: #64748b;
      margin-top: 0.2rem;
    }
    details {
      margin-top: 2rem;
    }
    summary {
      cursor: pointer;
      font-weight: 600;
      color: #475569;
    }
    pre {
      background-color: #1e293b;
      color: #e2e8f0;
      padding: 1rem;
      border-radius: 8px;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-word;
      margin-top: 0.75rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.85rem;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>

  <header>
    <h1>DMARCpeel</h1>
    <p>Skala av och analysera dina DMARC-rapporter (.xml, .gz, .zip, .eml, .msg) helt lokalt i webbläsaren.</p>
  </header>

  <main>
    <button id="openFileBtn">Välj DMARC-rapport</button>
    <div id="fileInfo">Ingen fil vald ännu.</div>

    <!-- Metadata för rapporten -->
    <section id="metaSection" class="meta-card hidden"></section>

    <!-- Resultattabell -->
    <table id="resultTable" class="hidden">
      <thead>
        <tr>
          <th>Sändande IP</th>
          <th>Antal</th>
          <th>Header From</th>
          <th>Åtgärd (Disposition)</th>
          <th>DMARC-utfall</th>
          <th>SPF (Tekniskt)</th>
          <th>DKIM (Tekniskt)</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>

    <!-- Hopfällbar rådata -->
    <details id="rawDetails" class="hidden">
      <summary>Visa uppackad XML-rådata</summary>
      <pre id="output"></pre>
    </details>
  </main>

  <script>
    const openFileBtn = document.getElementById('openFileBtn');
    const fileInfo = document.getElementById('fileInfo');
    const metaSection = document.getElementById('metaSection');
    const resultTable = document.getElementById('resultTable');
    const tableBody = document.getElementById('tableBody');
    const rawDetails = document.getElementById('rawDetails');
    const output = document.getElementById('output');

    function getText(parent, tagName, fallback = '–') {
      if (!parent) return fallback;
      const el = parent.getElementsByTagName(tagName)[0];
      return el && el.textContent ? el.textContent.trim() : fallback;
    }

    function createBadge(value) {
      if (!value) value = 'none';
      const val = value.toLowerCase();
      let cls = 'neutral';
      
      if (val === 'pass') {
        cls = 'pass';
      } else if (val === 'fail' || val === 'reject' || val === 'quarantine') {
        cls = 'fail';
      } else {
        cls = 'neutral';
      }

      return `<span class="badge ${cls}">${value}</span>`;
    }

    function formatUnixDate(unixStr) {
      const ts = parseInt(unixStr, 10);
      if (isNaN(ts)) return '–';
      return new Date(ts * 1000).toLocaleString('sv-SE', {
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit'
      });
    }

    async function parseByteArrayToXml(byteArray, hintFilename = '') {
      const name = hintFilename.toLowerCase();

      if (name.endsWith('.gz') || (byteArray.length > 2 && byteArray[0] === 0x1f && byteArray[1] === 0x8b)) {
        return pako.inflate(byteArray, { to: 'string' });
      }

      if (name.endsWith('.zip') || (byteArray.length > 2 && byteArray[0] === 0x50 && byteArray[1] === 0x4b)) {
        const zip = new JSZip();
        const zipContent = await zip.loadAsync(byteArray);
        const xmlFilename = Object.keys(zipContent.files).find(fn => fn.toLowerCase().endsWith('.xml'));
        if (!xmlFilename) throw new Error('Ingen XML-fil hittades i ZIP-arkivet.');
        return await zipContent.files[xmlFilename].async('string');
      }

      const decoder = new TextDecoder('utf-8');
      const text = decoder.decode(byteArray);
      if (text.includes('<feedback>') || text.includes('<?xml')) {
        return text;
      }

      throw new Error(`Kunde inte tolka bilagans format (${hintFilename}).`);
    }

    async function extractXmlFromFile(file) {
      const filename = file.name.toLowerCase();
      const arrayBuffer = await file.arrayBuffer();
      const uint8Array = new Uint8Array(arrayBuffer);

      if (filename.endsWith('.gz')) {
        return pako.inflate(uint8Array, { to: 'string' });
      }
      
      if (filename.endsWith('.zip')) {
        const zip = new JSZip();
        const zipContent = await zip.loadAsync(arrayBuffer);
        const xmlFilename = Object.keys(zipContent.files).find(name => name.toLowerCase().endsWith('.xml'));
        if (!xmlFilename) throw new Error('Ingen XML-fil hittades i ZIP-arkivet.');
        return await zipContent.files[xmlFilename].async('string');
      }

      if (filename.endsWith('.eml')) {
        const emlText = new TextDecoder().decode(arrayBuffer);
        const xmlMatch = emlText.match(/<\?xml[\s\S]*<\/feedback>/i);
        if (xmlMatch) return xmlMatch[0];
        throw new Error('EML-filen kunde inte läsas. Kontrollera att bilagan är i .xml, .gz eller .zip-format.');
      }

      if (filename.endsWith('.msg')) {
        // Kontrollera att MSGReader är tillgängligt
        const ReaderClass = window.MSGReader || window.MsgReader;
        if (!ReaderClass) {
          throw new Error('MSGReader-biblioteket kunde inte laddas från CDN.');
        }

        const msgReader = new ReaderClass(arrayBuffer);
        const msgData = msgReader.getFileData();

        if (msgData.error) {
          throw new Error('Kunde inte läsa Outlook .msg-filen: ' + msgData.error);
        }

        if (!msgData.attachments || msgData.attachments.length === 0) {
          throw new Error('Ingen bilaga hittades i Outlook .msg-filen.');
        }

        const attachment = msgData.attachments.find(att => {
          const attName = (att.fileName || att.longFileName || '').toLowerCase();
          return attName.endsWith('.xml') || attName.endsWith('.gz') || attName.endsWith('.zip');
        }) || msgData.attachments[0];

        const attName = attachment.fileName || attachment.longFileName || 'bilaga';
        const attData = msgReader.getAttachmentContent(attachment);

        return await parseByteArrayToXml(new Uint8Array(attData), attName);
      }

      const decoder = new TextDecoder('utf-8');
      return decoder.decode(arrayBuffer);
    }

    openFileBtn.addEventListener('click', async () => {
      try {
        const [fileHandle] = await window.showOpenFilePicker({ multiple: false });
        const file = await fileHandle.getFile();

        fileInfo.textContent = `Bearbetar fil: ${file.name}...`;

        const rawXmlText = await extractXmlFromFile(file);

        fileInfo.textContent = `Vald fil: ${file.name} (${file.size} bytes)`;
        output.textContent = rawXmlText;

        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(rawXmlText, 'application/xml');

        if (xmlDoc.getElementsByTagName('parsererror').length > 0) {
          throw new Error('Det uppackade innehållet är inte en giltig DMARC XML-rapport.');
        }

        const meta = xmlDoc.getElementsByTagName('report_metadata')[0];
        const policy = xmlDoc.getElementsByTagName('policy_published')[0];
        const dateRange = meta ? meta.getElementsByTagName('date_range')[0] : null;

        const orgName = getText(meta, 'org_name');
        const domain = getText(policy, 'domain');
        const pPolicy = getText(policy, 'p');
        const beginDate = formatUnixDate(getText(dateRange, 'begin'));
        const endDate = formatUnixDate(getText(dateRange, 'end'));

        const records = Array.from(xmlDoc.getElementsByTagName('record'));
        let totalMessages = 0;

        tableBody.innerHTML
