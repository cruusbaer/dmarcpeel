<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DMARCpeel – Lokal DMARC-analys</title>
  
  <!-- Inkludera Pako (.gz), JSZip (.zip) och @kenjiuno/msgreader (.msg) via CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@kenjiuno/msgreader@1.15.0/dist/MSGReader.min.js"></script>

  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 1200px;
      margin: 2rem auto;
      padding: 0 1rem;
      line-height: 1.5;
      color: #1e293b;
      background-color: #f8fafc;
    }
    header {
      margin-bottom: 1.5rem;
    }
    button {
      background-color: #0f172a;
      color: #ffffff;
      border: none;
      padding: 0.75rem 1.25rem;
      font-size: 1rem;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover {
      background-color: #334155;
    }
    #fileInfo {
      margin-top: 0.75rem;
      font-size: 0.9rem;
      color: #64748b;
    }
    .meta-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 1rem 1.5rem;
      margin-top: 1.5rem;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
    }
    .meta-item strong {
      display: block;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #64748b;
    }
    .meta-item span {
      font-size: 1.05rem;
      font-weight: 600;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: #ffffff;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #e2e8f0;
      margin-top: 1.5rem;
      font-size: 0.9rem;
    }
    th, td {
      padding: 0.75rem 1.25rem;
      text-align: left;
      border-bottom: 1px solid #e2e8f0;
    }
    th {
      background-color: #f1f5f9;
      font-weight: 600;
      color: #334155;
    }
    tr:last-child td {
      border-bottom: none;
    }
    tr:hover td {
      background-color: #f8fafc;
    }
    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    .badge {
      display: inline-block;
      padding: 0.15rem 0.5rem;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
    }
    .pass {
      background-color: #dcfce7;
      color: #166534;
    }
    .fail {
      background-color: #fee2e2;
      color: #991b1b;
    }
    .neutral {
      background-color: #f1f5f9;
      color: #475569;
    }
    .sub-detail {
      display: block;
      font-size: 0.78rem;
      color: #64748b;
      margin-top: 0.2rem;
    }
    details {
      margin-top: 2rem;
    }
    summary {
      cursor: pointer;
      font-weight: 600;
      color: #475569;
    }
    pre {
      background-color: #1e293b;
      color: #e2e8f0;
      padding: 1rem;
      border-radius: 8px;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-word;
      margin-top: 0.75rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.85rem;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>

  <header>
    <h1>DMARCpeel</h1>
    <p>Skala av och analysera dina DMARC-rapporter (.xml, .gz, .zip, .eml, .msg) helt lokalt i webbläsaren.</p>
  </header>

  <main>
    <button id="openFileBtn">Välj DMARC-rapport</button>
    <div id="fileInfo">Ingen fil vald ännu.</div>

    <!-- Metadata för rapporten -->
    <section id="metaSection" class="meta-card hidden"></section>

    <!-- Resultattabell -->
    <table id="resultTable" class="hidden">
      <thead>
        <tr>
          <th>Sändande IP</th>
          <th>Antal</th>
          <th>Header From</th>
          <th>Åtgärd (Disposition)</th>
          <th>DMARC-utfall</th>
          <th>SPF (Tekniskt)</th>
          <th>DKIM (Tekniskt)</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>

    <!-- Hopfällbar rådata -->
    <details id="rawDetails" class="hidden">
      <summary>Visa uppackad XML-rådata</summary>
      <pre id="output"></pre>
    </details>
  </main>

  <script>
    const openFileBtn = document.getElementById('openFileBtn');
    const fileInfo = document.getElementById('fileInfo');
    const metaSection = document.getElementById('metaSection');
    const resultTable = document.getElementById('resultTable');
    const tableBody = document.getElementById('tableBody');
    const rawDetails = document.getElementById('rawDetails');
    const output = document.getElementById('output');

    function getText(parent, tagName, fallback = '–') {
      if (!parent) return fallback;
      const el = parent.getElementsByTagName(tagName)[0];
      return el && el.textContent ? el.textContent.trim() : fallback;
    }

    function createBadge(value) {
      if (!value) value = 'none';
      const val = value.toLowerCase();
      let cls = 'neutral';
      
      if (val === 'pass') {
        cls = 'pass';
      } else if (val === 'fail' || val === 'reject' || val === 'quarantine') {
        cls = 'fail';
      } else {
        cls = 'neutral';
      }

      return `<span class="badge ${cls}">${value}</span>`;
    }

    function formatUnixDate(unixStr) {
      const ts = parseInt(unixStr, 10);
      if (isNaN(ts)) return '–';
      return new Date(ts * 1000).toLocaleString('sv-SE', {
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit'
      });
    }

    // --- Hjälpfunktion för rekursiv uppackning av bilagors data ---
    async function parseByteArrayToXml(byteArray, hintFilename = '') {
      const name = hintFilename.toLowerCase();

      // Om det är en .gz-fil
      if (name.endsWith('.gz') || (byteArray.length > 2 && byteArray[0] === 0x1f && byteArray[1] === 0x8b)) {
        return pako.inflate(byteArray, { to: 'string' });
      }

      // Om det är en .zip-fil
      if (name.endsWith('.zip') || (byteArray.length > 2 && byteArray[0] === 0x50 && byteArray[1] === 0x4b)) {
        const zip = new JSZip();
        const zipContent = await zip.loadAsync(byteArray);
        const xmlFilename = Object.keys(zipContent.files).find(fn => fn.toLowerCase().endsWith('.xml'));
        if (!xmlFilename) throw new Error('Ingen XML-fil hittades i ZIP-arkivet.');
        return await zipContent.files[xmlFilename].async('string');
      }

      // Annars provar vi att tolka som ren text (XML)
      const decoder = new TextDecoder('utf-8');
      const text = decoder.decode(byteArray);
      if (text.includes('<feedback>') || text.includes('<?xml')) {
        return text;
      }

      throw new Error(`Kunde inte tolka bilagans format (${hintFilename}).`);
    }

    // --- Parser-motor för olika filformat (.xml, .gz, .zip, .eml, .msg) ---
    async function extractXmlFromFile(file) {
      const filename = file.name.toLowerCase();
      const arrayBuffer = await file.arrayBuffer();
      const uint8Array = new Uint8Array(arrayBuffer);

      // 1. GZ-format
      if (filename.endsWith('.gz')) {
        return pako.inflate(uint8Array, { to: 'string' });
      }
      
      // 2. ZIP-format
      if (filename.endsWith('.zip')) {
        const zip = new JSZip();
        const zipContent = await zip.loadAsync(arrayBuffer);
        const xmlFilename = Object.keys(zipContent.files).find(name => name.toLowerCase().endsWith('.xml'));
        if (!xmlFilename) throw new Error('Ingen XML-fil hittades i ZIP-arkivet.');
        return await zipContent.files[xmlFilename].async('string');
      }

      // 3. EML-format (textbaserat mail)
      if (filename.endsWith('.eml')) {
        const emlText = new TextDecoder().decode(arrayBuffer);
        const xmlMatch = emlText.match(/<\?xml[\s\S]*<\/feedback>/i);
        if (xmlMatch) return xmlMatch[0];
        throw new Error('EML-filen kunde inte läsas. Kontrollera att bilagan är i .xml, .gz eller .zip-format.');
      }

      // 4. MSG-format (Outlook OLE-objekt)
      if (filename.endsWith('.msg')) {
        const msgReader = new MSGReader(arrayBuffer);
        const msgData = msgReader.getFileData();

        if (msgData.error) {
          throw new Error('Kunde inte läsa Outlook .msg-filen: ' + msgData.error);
        }

        if (!msgData.attachments || msgData.attachments.length === 0) {
          throw new Error('Ingen bilaga hittades i Outlook .msg-filen.');
        }

        // Hitta första bilagan som ser ut att vara en DMARC-rapport (gz, zip, xml)
        const attachment = msgData.attachments.find(att => {
          const attName = (att.fileName || att.longFileName || '').toLowerCase();
          return attName.endsWith('.xml') || attName.endsWith('.gz') || attName.endsWith('.zip');
        }) || msgData.attachments[0]; // Fallback till första bilagan

        const attName = attachment.fileName || attachment.longFileName || 'bilaga';
        const attData = msgReader.getAttachmentContent(attachment);

        return await parseByteArrayToXml(new Uint8Array(attData), attName);
      }

      // 5. Standard: Ren XML-fil
      const decoder = new TextDecoder('utf-8');
      return decoder.decode(arrayBuffer);
    }

    openFileBtn.addEventListener('click', async () => {
      try {
        const [fileHandle] = await window.showOpenFilePicker({ multiple: false });
        const file = await fileHandle.getFile();

        fileInfo.textContent = `Bearbetar fil: ${file.name}...`;

        const rawXmlText = await extractXmlFromFile(file);

        fileInfo.textContent = `Vald fil: ${file.name} (${file.size} bytes)`;
        output.textContent = rawXmlText;

        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(rawXmlText, 'application/xml');

        if (xmlDoc.getElementsByTagName('parsererror').length > 0) {
          throw new Error('Det uppackade innehållet är inte en giltig DMARC XML-rapport.');
        }

        const meta = xmlDoc.getElementsByTagName('report_metadata')[0];
        const policy = xmlDoc.getElementsByTagName('policy_published')[0];
        const dateRange = meta ? meta.getElementsByTagName('date_range')[0] : null;

        const orgName = getText(meta, 'org_name');
        const domain = getText(policy, 'domain');
        const pPolicy = getText(policy, 'p');
        const beginDate = formatUnixDate(getText(dateRange, 'begin'));
        const endDate = formatUnixDate(getText(dateRange, 'end'));

        const records = Array.from(xmlDoc.getElementsByTagName('record'));
        let totalMessages = 0;

        tableBody.innerHTML = '';

        records.forEach(record => {
          const row = record.getElementsByTagName('row')[0];
          const identifiers = record.getElementsByTagName('identifiers')[0];
          const authResults = record.getElementsByTagName('auth_results')[0];
          const policyEval = row ? row.getElementsByTagName('policy_evaluated')[0] : null;

          const sourceIp = getText(row, 'source_ip');
          const count = parseInt(getText(row, 'count', '0'), 10);
          totalMessages += count;

          const disposition = getText(policyEval, 'disposition', 'none');
          const evalDkim = getText(policyEval, 'dkim');
          const evalSpf = getText(policyEval, 'spf');
          
          const dmarcPassed = (evalDkim === 'pass' || evalSpf === 'pass') ? 'pass' : 'fail';
          const headerFrom = getText(identifiers, 'header_from');

          const spfNode = authResults ? authResults.getElementsByTagName('spf')[0] : null;
          const rawSpfResult = getText(spfNode, 'result', 'none');
          const rawSpfDomain = getText(spfNode, 'domain', '');

          const dkimNodes = authResults ? Array.from(authResults.getElementsByTagName('dkim')) : [];
          let dkimDetailsHtml = '';
          let bestDkimResult = 'none';

          if (dkimNodes.length > 0) {
            bestDkimResult = getText(dkimNodes[0], 'result', 'none');
            dkimDetailsHtml = dkimNodes.map(d => {
              const res = getText(d, 'result');
              const dom = getText(d, 'domain', '');
              const sel = getText(d, 'selector', '');
              return `${res} (${dom}${sel ? ' / ' + sel : ''})`;
            }).join('<br>');
          } else {
            dkimDetailsHtml = 'Ingen signatur (none)';
          }

          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td class="mono"><strong>${sourceIp}</strong></td>
            <td><strong>${count}</strong></td>
            <td class="mono">${headerFrom}</td>
            <td>${createBadge(disposition)}</td>
            <td>${createBadge(dmarcPassed)}</td>
            <td>
              ${createBadge(rawSpfResult)}
              <span class="sub-detail">${rawSpfDomain}</span>
            </td>
            <td>
              ${createBadge(bestDkimResult)}
              <span class="sub-detail">${dkimDetailsHtml}</span>
            </td>
          `;
          tableBody.appendChild(tr);
        });

        metaSection.innerHTML = `
          <div class="meta-item"><strong>Rapportör</strong><span>${orgName}</span></div>
          <div class="meta-item"><strong>Din domän (Policy)</strong><span>${domain} (p=${pPolicy})</span></div>
          <div class="meta-item"><strong>Totalt antal mail</strong><span>${totalMessages} st (${records.length} poster)</span></div>
          <div class="meta-item"><strong>Period</strong><span>${beginDate} – ${endDate}</span></div>
        `;

        metaSection.classList.remove('hidden');
        resultTable.classList.remove('hidden');
        rawDetails.classList.remove('hidden');

      } catch (err) {
        if (err.name !== 'AbortError') {
          console.error(err);
          fileInfo.textContent = `Fel vid bearbetning: ${err.message}`;
        }
      }
    });
  </script>

</body>
</html>
