<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DMARCpeel – Lokal DMARC-analys</title>
  
  <!-- Lätta och nödvändiga komprimeringsbibliotek via CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 1200px;
      margin: 2rem auto;
      padding: 0 1rem;
      line-height: 1.5;
      color: #1e293b;
      background-color: #f8fafc;
    }
    header {
      margin-bottom: 1.5rem;
    }
    button {
      background-color: #0f172a;
      color: #ffffff;
      border: none;
      padding: 0.75rem 1.25rem;
      font-size: 1rem;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover {
      background-color: #334155;
    }
    #fileInput {
      display: none;
    }
    #fileInfo {
      margin-top: 0.75rem;
      font-size: 0.9rem;
      color: #64748b;
    }
    .meta-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 1rem 1.5rem;
      margin-top: 1.5rem;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
    }
    .meta-item strong {
      display: block;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #64748b;
    }
    .meta-item span {
      font-size: 1.05rem;
      font-weight: 600;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: #ffffff;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #e2e8f0;
      margin-top: 1.5rem;
      font-size: 0.9rem;
    }
    th, td {
      padding: 0.75rem 1.25rem;
      text-align: left;
      border-bottom: 1px solid #e2e8f0;
    }
    th {
      background-color: #f1f5f9;
      font-weight: 600;
      color: #334155;
    }
    tr:last-child td {
      border-bottom: none;
    }
    tr:hover td {
      background-color: #f8fafc;
    }
    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    .badge {
      display: inline-block;
      padding: 0.15rem 0.5rem;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
    }
    .pass {
      background-color: #dcfce7;
      color: #166534;
    }
    .fail {
      background-color: #fee2e2;
      color: #991b1b;
    }
    .neutral {
      background-color: #f1f5f9;
      color: #475569;
    }
    .sub-detail {
      display: block;
      font-size: 0.78rem;
      color: #64748b;
      margin-top: 0.2rem;
    }
    details {
      margin-top: 2rem;
    }
    summary {
      cursor: pointer;
      font-weight: 600;
      color: #475569;
    }
    pre {
      background-color: #1e293b;
      color: #e2e8f0;
      padding: 1rem;
      border-radius: 8px;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-word;
      margin-top: 0.75rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.85rem;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>

  <header>
    <h1>DMARCpeel</h1>
    <p>Skala av och analysera dina DMARC-rapporter (.xml, .gz, .zip, .eml, .msg) helt lokalt i webbläsaren.</p>
  </header>

  <main>
    <input type="file" id="fileInput" accept=".xml,.gz,.zip,.eml,.msg">
    <button id="openFileBtn">Välj DMARC-rapport</button>
    <div id="fileInfo">Ingen fil vald ännu.</div>

    <section id="metaSection" class="meta-card hidden"></section>

    <table id="resultTable" class="hidden">
      <thead>
        <tr>
          <th>Sändande IP</th>
          <th>Antal</th>
          <th>Header From</th>
          <th>Åtgärd (Disposition)</th>
          <th>DMARC-utfall</th>
          <th>SPF (Tekniskt)</th>
          <th>DKIM (Tekniskt)</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>

    <details id="rawDetails" class="hidden">
      <summary>Visa uppackad XML-rådata</summary>
      <pre id="output"></pre>
    </details>
  </main>

  <!-- Ladda vår egna logikfil -->
  <script src="app.js"></script>
</body>
</html>
